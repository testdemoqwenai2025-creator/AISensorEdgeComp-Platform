# Sector: Water Treatment
# Override base platform config with sector-specific defaults

sector:
  id: water-treatment
  name: "Water Treatment"
  description: "Intake + treatment + distribution sensor intelligence"

sensors:
  modalities: ['pressure', 'flow', 'temperature', 'vision', 'chemical']
  calibration_interval_days:
    vibration: 180
    temperature: 365
    pressure: 180
    gas: 90
    flow: 180
    vision: null  # intrinsics only
    mmwave: 365
    soil: 30
    weather: 365
    chemical: 30

edge:
  default_silicon: "hailo-8"
  inference_sla_ms: 100
  wan_loss_autonomy_hours: 72

compliance:
  standards: ['Safe Drinking Water Act', 'EPA Lead and Copper Rule', 'ISO 24528']
  data_residency: "us"
  audit_log: true
  encryption_at_rest: true

ml:
  ts_fm_model: "ts-fm-v1-water-treatment"
  rul_models:
    - asset_class: "pump"
      fine_tune_data: "sector-specific labeled failures"
