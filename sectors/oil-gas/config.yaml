# Sector: Oil & Gas
# Override base platform config with sector-specific defaults

sector:
  id: oil-gas
  name: "Oil & Gas"
  description: "Upstream + midstream + downstream sensor intelligence"

sensors:
  modalities: ['vibration', 'pressure', 'temperature', 'gas', 'flow']
  calibration_interval_days:
    vibration: 180
    temperature: 365
    pressure: 180
    gas: 90
    flow: 180
    vision: null  # intrinsics only
    mmwave: 365
    soil: 30
    weather: 365
    chemical: 30

edge:
  default_silicon: "hailo-8"
  inference_sla_ms: 100
  wan_loss_autonomy_hours: 72

compliance:
  standards: ['API 1160', 'PHMSA', 'OSHA 1910']
  data_residency: "us"
  audit_log: true
  encryption_at_rest: true

ml:
  ts_fm_model: "ts-fm-v1-oil-gas"
  rul_models:
    - asset_class: "pump"
      fine_tune_data: "sector-specific labeled failures"
