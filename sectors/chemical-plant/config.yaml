# Sector: Chemical Plant
# Override base platform config with sector-specific defaults

sector:
  id: chemical-plant
  name: "Chemical Plant"
  description: "Reactor + distillation + storage tank monitoring"

sensors:
  modalities: ['vibration', 'temperature', 'pressure', 'gas', 'flow', 'vision']
  calibration_interval_days:
    vibration: 180
    temperature: 365
    pressure: 180
    gas: 90
    flow: 180
    vision: null  # intrinsics only
    mmwave: 365
    soil: 30
    weather: 365
    chemical: 30

edge:
  default_silicon: "hailo-8"
  inference_sla_ms: 100
  wan_loss_autonomy_hours: 72

compliance:
  standards: ['OSHA PSM (29 CFR 1910.119)', 'EPA RMP', 'IEC 61511 (SIS)']
  data_residency: "us"
  audit_log: true
  encryption_at_rest: true

ml:
  ts_fm_model: "ts-fm-v1-chemical-plant"
  rul_models:
    - asset_class: "pump"
      fine_tune_data: "sector-specific labeled failures"
