# Sector: Autonomous Vehicles
# Override base platform config with sector-specific defaults

sector:
  id: autonomous-vehicles
  name: "Autonomous Vehicles"
  description: "Fleet health monitoring, perception sensor analytics, safety event recording"

sensors:
  modalities: ['vision', 'mmwave', 'vibration', 'temperature', 'pressure']
  calibration_interval_days:
    vibration: 180
    temperature: 365
    pressure: 180
    gas: 90
    flow: 180
    vision: null  # intrinsics only
    mmwave: 365
    soil: 30
    weather: 365
    chemical: 30

edge:
  default_silicon: "hailo-8"
  inference_sla_ms: 100
  wan_loss_autonomy_hours: 72

compliance:
  standards: ['ISO 26262 (ASIL-D)', 'SAE J3016', 'UN-R155 cybersecurity']
  data_residency: "us"
  audit_log: true
  encryption_at_rest: true

ml:
  ts_fm_model: "ts-fm-v1-autonomous-vehicles"
  rul_models:
    - asset_class: "pump"
      fine_tune_data: "sector-specific labeled failures"
