# Sector: Smart Grid
# Override base platform config with sector-specific defaults

sector:
  id: smart-grid
  name: "Smart Grid"
  description: "Generation + transmission + distribution sensor intelligence"

sensors:
  modalities: ['vibration', 'temperature', 'current', 'voltage', 'phasor']
  calibration_interval_days:
    vibration: 180
    temperature: 365
    pressure: 180
    gas: 90
    flow: 180
    vision: null  # intrinsics only
    mmwave: 365
    soil: 30
    weather: 365
    chemical: 30

edge:
  default_silicon: "hailo-8"
  inference_sla_ms: 100
  wan_loss_autonomy_hours: 72

compliance:
  standards: ['NERC CIP', 'IEC 61850', 'IEEE 1547 (distributed gen)']
  data_residency: "us"
  audit_log: true
  encryption_at_rest: true

ml:
  ts_fm_model: "ts-fm-v1-smart-grid"
  rul_models:
    - asset_class: "pump"
      fine_tune_data: "sector-specific labeled failures"
