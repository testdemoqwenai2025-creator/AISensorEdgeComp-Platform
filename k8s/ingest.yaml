apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
  namespace: aisensoredgecomp
spec:
  replicas: 6
  selector:
    matchLabels:
      app: ingest
  template:
    metadata:
      labels:
        app: ingest
    spec:
      containers:
        - name: ingest
          image: ghcr.io/testdemoqwenai2025-creator/aisensoredgecomp-ingest:latest
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: ingest-config
            - secretRef:
                name: ingest-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: 256Mi
              cpu: 200m
            limits:
              memory: 512Mi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: ingest
  namespace: aisensoredgecomp
spec:
  selector:
    app: ingest
  ports:
    - port: 8001
      targetPort: 8001
