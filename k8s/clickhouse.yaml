apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: aisensoredgecomp
spec:
  serviceName: clickhouse
  replicas: 1  # Shard + replica via dedicated ClickHouse operator in production
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24-alpine
          ports:
            - containerPort: 8123
            - containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
          resources:
            requests:
              memory: 8Gi
              cpu: 4
            limits:
              memory: 16Gi
              cpu: 8
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ssd
        resources:
          requests:
            storage: 2Ti
