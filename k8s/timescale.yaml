apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timescale
  namespace: aisensoredgecomp
spec:
  serviceName: timescale
  replicas: 3
  selector:
    matchLabels:
      app: timescale
  template:
    metadata:
      labels:
        app: timescale
    spec:
      containers:
        - name: timescale
          image: timescale/timescaledb:2.14-pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: aisensoredgecomp
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: timescale-secrets
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: timescale-secrets
                  key: password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: 4Gi
              cpu: 2
            limits:
              memory: 8Gi
              cpu: 4
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ssd
        resources:
          requests:
            storage: 500Gi
---
apiVersion: v1
kind: Service
metadata:
  name: timescale
  namespace: aisensoredgecomp
spec:
  selector:
    app: timescale
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
