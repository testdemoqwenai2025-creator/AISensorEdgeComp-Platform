global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ingest
    static_configs:
      - targets: ['ingest:8001']
    metrics_path: /metrics

  - job_name: api
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics

  - job_name: ml
    static_configs:
      - targets: ['ml:8002']
    metrics_path: /metrics

  - job_name: kafka
    static_configs:
      - targets: ['kafka:9092']

  - job_name: flink
    static_configs:
      - targets: ['flink-jobmanager:8081']

  - job_name: timescale
    static_configs:
      - targets: ['timescale:5432']

  - job_name: clickhouse
    static_configs:
      - targets: ['clickhouse:8123']
