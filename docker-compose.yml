version: "3.9"

services:
  # ─── MQTT broker ──────────────────────────────────────────────────
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: asec-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./services/ingest/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/health", "-C", "1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Kafka (KRaft mode, no Zookeeper) ────────────────────────────
  kafka:
    image: bitnami/kafka:3.7
    container_name: asec-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_KRAFT_CLUSTER_ID: aisensoredgecomp
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--list", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ─── Schema Registry ──────────────────────────────────────────────
  schema-registry:
    image: bitnami/schema-registry:7.6
    container_name: asec-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_KAFKA_BROKERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_MODE: read_write

  # ─── TimescaleDB (hot storage) ────────────────────────────────────
  timescale:
    image: timescale/timescaledb:2.14-pg16
    container_name: asec-timescale
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: aisensoredgecomp
      POSTGRES_USER: aisensoredgecomp
      POSTGRES_PASSWORD: changeme
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./services/storage/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aisensoredgecomp"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── MinIO (S3 for Iceberg) ───────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: asec-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Iceberg REST catalog ────────────────────────────────────────
  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    container_name: asec-iceberg-rest
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "8181:8181"
    environment:
      CATALOG_WAREHOUSE: s3://aisensoredgecomp-warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3__ENDPOINT: http://minio:9000
      CATALOG_S3__PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      AWS_REGION: us-east-1

  # ─── ClickHouse (OLAP) ────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: asec-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: aisensoredgecomp
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./services/storage/clickhouse-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Flink jobmanager + taskmanager ───────────────────────────────
  flink-jobmanager:
    image: flink:1.19-scala_2.12-java17
    container_name: asec-flink-jm
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        state.backend: rocksdb
        state.checkpoints.dir: file:///checkpoints
        execution.checkpointing.interval: 60s
    volumes:
      - flink-checkpoints:/checkpoints

  flink-taskmanager:
    image: flink:1.19-scala_2.12-java17
    container_name: asec-flink-tm
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        state.backend: rocksdb
    volumes:
      - flink-checkpoints:/checkpoints

  # ─── Ingest service (FastAPI + MQTT subscriber + Kafka producer) ──
  ingest:
    build: ./services/ingest
    container_name: asec-ingest
    depends_on:
      mqtt:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started
    env_file: .env
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── API server (FastAPI) ──────────────────────────────────────────
  api:
    build: ./services/api
    container_name: asec-api
    depends_on:
      timescale:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    env_file: .env
    ports:
      - "8000:8000"

  # ─── ML inference service ──────────────────────────────────────────
  ml:
    build: ./services/ml
    container_name: asec-ml
    depends_on:
      kafka:
        condition: service_healthy
    env_file: .env
    ports:
      - "8002:8002"

  # ─── Observability ────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: asec-prometheus
    ports:
      - "9095:9090"
    volumes:
      - ./services/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: asec-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  mqtt-data:
  kafka-data:
  timescale-data:
  minio-data:
  clickhouse-data:
  flink-checkpoints:
  grafana-data:
